name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://abou_test:abou_test@localhost:5432/abou_test
      AUTH_EMAIL_PROVIDER: development
      RUN_INTEGRATION_TESTS: 'true'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: abou_test
          POSTGRES_PASSWORD: abou_test
          POSTGRES_DB: abou_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U abou_test -d abou_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Apply database migrations
        run: npm run db:deploy

      - name: Verify API readiness contract
        run: npm run test -w @abou/api -- src/app.test.ts

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
