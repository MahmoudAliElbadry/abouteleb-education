services:
  - type: web
    name: abou-taleb-education-api
    runtime: node
    domains:
      - api.aboutalebeducation.com
    renderSubdomainPolicy: disabled
    buildCommand: npm ci && npm run build -w @abou/contracts && npm run build -w @abou/api
    startCommand: npm run start -w @abou/api
    healthCheckPath: /api/v1/health/readiness
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        value: https://aboutalebeducation.com
      - key: COOKIE_DOMAIN
        value: .aboutalebeducation.com
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        value: Abou-Taleb Education
      - key: EMAIL_LOGO_URL
        value: https://aboutalebeducation.com/images/email-logo.png
      - key: EMAIL_BRAND_URL
        value: https://aboutalebeducation.com
      - key: SENTRY_DSN
        sync: false
