services:
  - type: web
    name: abou-taleb-education-api
    runtime: node
    buildCommand: npm ci && npm run build -w @abou/api
    startCommand: npm run start -w @abou/api
    healthCheckPath: /api/v1/health/readiness
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: COOKIE_DOMAIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SENTRY_DSN
        sync: false
  - type: web
    name: abou-taleb-education-web
    runtime: static
    buildCommand: npm ci && npm run build -w @abou/web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SENTRY_DSN
        sync: false
