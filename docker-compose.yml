services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: abou
      POSTGRES_PASSWORD: abou
      POSTGRES_DB: abou_taleb
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U abou -d abou_taleb']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
